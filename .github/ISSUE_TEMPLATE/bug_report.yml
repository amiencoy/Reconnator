name: Bug report
description: Report a reproducible problem in Reconnator
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include secrets, private scan
        results, unauthorized target information, or security vulnerabilities.
        Report suspected vulnerabilities through the Security Policy instead.

  - type: input
    id: version
    attributes:
      label: Reconnator version
      description: Provide a release, image tag, or commit SHA.
      placeholder: "Example: main at 70ca97b or ghcr.io/amiencoy/reconnator:sha-70ca97b"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Local Python environment
        - Docker
        - Kubernetes or Helm
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Python, Docker, and Kubernetes versions when relevant.
      placeholder: "Example: Ubuntu 24.04, amd64, Python 3.11, Docker 28"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Telegram bot
        - MCP server or agent routing
        - Nmap worker
        - Nuclei worker
        - Ffuf worker
        - Subfinder, dnsx, or OTX pipeline
        - PDF reporting
        - Docker or GHCR image
        - Kubernetes or Helm
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest authorized reproduction you can.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, credentials, personal data, and sensitive target information.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and sensitive or unauthorized target data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
        - label: Any target used for reproduction is owned by me or explicitly authorized.
          required: true
