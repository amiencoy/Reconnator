# ==================================================================================== #
# This is Reconnator's Dependabot policy for Python, containers, and GitHub Actions.  #
# It keeps dependency upgrades visible through scheduled, reviewable pull requests.   #
# ==================================================================================== #

version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    ignore:
      # MCP 2.x currently conflicts with FastMCP 3.4.7's mcp<2.0 constraint.
      # Remove this hold only in a coordinated MCP/FastMCP migration pull request.
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
