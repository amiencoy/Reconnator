# ==================================================================================== #
# This file groups merged pull requests into consistent GitHub Release notes.         #
# Its categories keep features, fixes, security work, and maintenance easy to scan.   #
# ==================================================================================== #

changelog:
  exclude:
    labels:
      - "skip-changelog"
  categories:
    - title: "Breaking Changes"
      labels:
        - "breaking-change"
    - title: "Features"
      labels:
        - "enhancement"
    - title: "Bug Fixes"
      labels:
        - "bug"
    - title: "Security"
      labels:
        - "security"
    - title: "Dependencies"
      labels:
        - "dependencies"
    - title: "Documentation"
      labels:
        - "documentation"
    - title: "Other Changes"
      labels:
        - "*"
