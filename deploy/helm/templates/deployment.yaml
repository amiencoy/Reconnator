# ==================================================================================== #
# This is the Deployment manifest for Reconnator. We replaced the old CronJob because  #
# Reconnator is now an always-on Telegram bot, not a one-off run-and-die script.       #
# CRITICAL: We mount the host's docker.sock so the pod can spawn our ephemeral         #
# containers (Nmap, Nuclei, etc.) using the Docker-out-of-Docker (DooD) technique.     #
# Note: Ensure your Kubernetes nodes (e.g., k3s) have Docker installed and accessible. #
# ==================================================================================== #

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reconnator
  labels:
    app: reconnator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconnator
  template:
    metadata:
      labels:
        app: reconnator
    spec:
      containers:
      - name: reconnator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-telegram-secret
        env:
        - name: AI_PROVIDER
          value: {{ .Values.ai.provider | quote }}
        - name: AI_MODEL
          value: {{ .Values.ai.model | quote }}
        - name: AI_BASE_URL
          value: {{ .Values.ai.baseUrl | quote }}
        - name: AI_TEMPERATURE
          value: {{ .Values.ai.temperature | quote }}
        - name: AI_TIMEOUT_SECONDS
          value: {{ .Values.ai.timeoutSeconds | quote }}

        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
          
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
