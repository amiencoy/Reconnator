# ==================================================================================== #
# This is the Secret manifest for Reconnator. It securely injects our sensitive        #
# credentials into the Deployment as environment variables.                            #
# We've updated this to include the Gemini API Key, which is the brain of the Agent.   #
# CRITICAL: Values here are automatically base64 encoded by Helm during deployment.    #
# ==================================================================================== #

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-telegram-secret
type: Opaque
data:
  TELEGRAM_BOT_TOKEN: {{ default "" .Values.telegram.botToken | b64enc | quote }}
  TELEGRAM_CHAT_ID: {{ default "" .Values.telegram.chatId | b64enc | quote }}
  GEMINI_API_KEY: {{ default "" .Values.ai.geminiApiKey | b64enc | quote }}