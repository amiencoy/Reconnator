# ============================================================================================================================================ #
# This is the values.yaml file. The configuration hub for our Helm chart.                                                                      #
# We stripped out the old 'schedule' and 'targetDomain' because now it runs 24/7 as a Telegram bot and takes targets dynamically via chat.     #
# The AI block supports local and hosted OpenAI-compatible providers.                                                                          #
# ============================================================================================================================================ #

image:
  repository: ghcr.io/amiencoy/reconnator
  tag: "2.2.0"
  pullPolicy: IfNotPresent

telegram:
  botToken: ""
  chatId: ""
  allowedChatIds: ""

ai:
  provider: ollama
  model: qwen3:8b
  # Use a Kubernetes Service URL here. localhost points to the Reconnator pod.
  baseUrl: http://ollama.default.svc.cluster.local:11434/v1/chat/completions
  temperature: "0"
  timeoutSeconds: "300"
  apiKey: ""
  # Legacy fallback used only when provider is gemini.
  geminiApiKey: ""
