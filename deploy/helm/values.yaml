# ============================================================================================================================================ #
# This is the values.yaml file. The configuration hub for our Helm chart.                                                                      #
# We stripped out the old 'schedule' and 'targetDomain' because now it runs 24/7 as a Telegram bot and takes targets dynamically via chat.     #
# We also added the AI block to securely pass the Gemini API key to the agent.                                                                 #
# ============================================================================================================================================ #

image:
  repository: reconnator
  tag: "v2"
  pullPolicy: IfNotPresent

telegram:
  botToken: ""
  chatId: ""

ai:
  geminiApiKey: ""